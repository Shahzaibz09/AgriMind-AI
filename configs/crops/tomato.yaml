# AgriMind AI — Tomato Crop Configuration
#
# Each crop has its own YAML file in configs/crops/.
# The web application auto-discovers all crop configs at startup.

crop_name: "Tomato"
description: "Tomato leaf disease detection"
model_path: "models/best_model.pth"
checkpoint_key: "model_state_dict"
num_classes: 3
class_names:
  - "Healthy"
  - "Early Blight"
  - "Late Blight"
image_size: 224
gradcam_alpha: 0.4

# Display metadata for the web UI
display:
  model_architecture: "MobileNetV3-Small"
  test_accuracy: 96.51
  test_samples: 688
  dataset: "PlantVillage"

# Human-readable descriptions shown in the UI
class_descriptions:
  Healthy: "No disease detected. Leaf appears healthy."
  Early Blight: "Early blight (Alternaria solani) detected."
  Late Blight: "Late blight (Phytophthora infestans) detected."

# Robustness guard thresholds (app/guard.py).  Calibrated against the
# 688-image test distribution; reject thresholds sit at or below half
# the real-data minimum, so legitimate leaf images are never rejected.
guard:
  min_resolution: 64
  saturation_min: 0.02
  flatness_lapvar_min: 10
  green_fraction_min: 0.01
  correlation_min: 0.20
  blur_lapvar_warn: 300
  confidence_warn: 0.75
  margin_warn: 0.25
